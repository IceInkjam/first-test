<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜词消消乐 · 英中配对</title>
<meta name="description" content="把英文单词和中文释义配对消除的轻量记词游戏">
<style>
/* ==========================================================================
   猜词消消乐 —— 样式表
   风格：明快清爽。薄荷绿 → 天空蓝的浅色渐变，糖果质感卡片，圆润饱满。
   ========================================================================== */

:root {
  /* 主色：清新的青绿 */
  --mint:        #34c9a3;
  --mint-dark:   #1fa586;
  --mint-pale:   #e4f8f2;

  /* 辅色：天空蓝（用于英文卡片） */
  --sky:         #3ba9e8;
  --sky-dark:    #2b8cc4;
  --sky-pale:    #e3f3fd;

  /* 点缀色 */
  --sun:         #ffc93c;   /* 选中 / 连击 */
  --coral:       #ff7a6b;   /* 配对错误 */
  --grape:       #9d7bea;   /* 提示 */

  /* 中性色 */
  --ink:         #2c3e46;
  --ink-2:       #5c7078;
  --ink-3:       #92a5ad;
  --line:        #e2eef0;
  --surface:     #ffffff;

  /* 圆角与阴影（浅色 UI 用柔和的彩色投影，不用纯黑） */
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 26px;
  --r-pill: 999px;
  --shadow-sm: 0 2px 6px rgba(44, 110, 130, .08);
  --shadow-md: 0 6px 18px rgba(44, 110, 130, .12);
  --shadow-lg: 0 16px 40px rgba(44, 110, 130, .16);

  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", Roboto, "Helvetica Neue", sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 16px 40px;

  /* 明快的底色：薄荷 → 天空蓝，叠加两团柔光 */
  background:
    radial-gradient(circle at 12% 10%, rgba(52, 201, 163, .20), transparent 45%),
    radial-gradient(circle at 88% 88%, rgba(59, 169, 232, .20), transparent 45%),
    linear-gradient(160deg, #f2fdfa 0%, #eef9fd 55%, #f4fbff 100%);
  background-attachment: fixed;
  color: var(--ink);
  line-height: 1.6;
}

/* 卡片交互元素禁止选中文字，避免连点选中 */
.card, .pill, .btn, .stat {
  user-select: none;
}

/* ==========================================================================
   主容器
   ========================================================================== */
.app {
  width: min(100%, 880px);
  background: rgba(255, 255, 255, .78);
  -webkit-backdrop-filter: blur(12px) saturate(150%);
  backdrop-filter: blur(12px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  padding: 26px 26px 22px;
}

/* ==========================================================================
   标题区
   ========================================================================== */
.head {
  text-align: center;
  margin-bottom: 18px;
}

.head h1 {
  font-size: clamp(22px, 3.4vw, 30px);
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.head h1 .em {
  font-size: 1.05em;
}

.head .sub {
  margin-top: 6px;
  font-size: 13.5px;
  color: var(--ink-3);
  letter-spacing: .5px;
}

/* 顶部装饰性小圆点，增加活泼感 */
.head .dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
}

.head .dots i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.head .dots i:nth-child(1) { background: var(--mint); }
.head .dots i:nth-child(2) { background: var(--sky); }
.head .dots i:nth-child(3) { background: var(--sun); }
.head .dots i:nth-child(4) { background: var(--coral); }
.head .dots i:nth-child(5) { background: var(--grape); }

/* ==========================================================================
   难度选择
   ========================================================================== */
.difficulty {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
}

.diff-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 20px;

  background: #fff;
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
  color: var(--ink-2);
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  transition: transform .15s ease, border-color .2s ease,
              background .2s ease, box-shadow .2s ease, color .2s ease;
}

.diff-pill:hover {
  border-color: var(--mint);
  color: var(--mint-dark);
  transform: translateY(-2px);
}

/* 选中态：实心青绿 + 立体投影 */
.diff-pill.active {
  background: linear-gradient(180deg, #47d6b0, var(--mint));
  border-color: var(--mint-dark);
  color: #fff;
  box-shadow: 0 4px 0 var(--mint-dark), var(--shadow-sm);
  transform: translateY(0);
}

.diff-pill.active:hover {
  transform: translateY(-1px);
}

.diff-pill .n {
  font-size: 12.5px;
  opacity: .8;
  font-weight: 600;
}

/* ==========================================================================
   按钮
   ========================================================================== */
.bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 20px;

  border: none;
  border-radius: var(--r-pill);
  background: linear-gradient(180deg, #55b6ea, var(--sky));
  color: #fff;
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--sky-dark), var(--shadow-sm);
  transition: transform .1s ease, box-shadow .1s ease, opacity .2s ease;
}

.btn:hover   { transform: translateY(-1px); box-shadow: 0 5px 0 var(--sky-dark), var(--shadow-md); }
.btn:active  { transform: translateY(3px);  box-shadow: 0 1px 0 var(--sky-dark); }

.btn.green {
  background: linear-gradient(180deg, #47d6b0, var(--mint));
  box-shadow: 0 4px 0 var(--mint-dark), var(--shadow-sm);
}
.btn.green:hover  { box-shadow: 0 5px 0 var(--mint-dark), var(--shadow-md); }
.btn.green:active { box-shadow: 0 1px 0 var(--mint-dark); }

.btn.sun {
  background: linear-gradient(180deg, #ffd76b, var(--sun));
  color: #7a5600;
  box-shadow: 0 4px 0 #d9a017, var(--shadow-sm);
}
.btn.sun:hover  { box-shadow: 0 5px 0 #d9a017, var(--shadow-md); }
.btn.sun:active { box-shadow: 0 1px 0 #d9a017; }

.btn.ghost {
  background: #fff;
  color: var(--ink-2);
  border: 2px solid var(--line);
  box-shadow: 0 3px 0 var(--line);
}
.btn.ghost:hover  { border-color: var(--mint); color: var(--mint-dark); box-shadow: 0 4px 0 var(--line); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }

.btn:disabled {
  opacity: .45;
  pointer-events: none;
  box-shadow: none;
}

/* ==========================================================================
   状态栏
   ========================================================================== */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.stat {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px 8px;
  text-align: center;
  box-shadow: var(--shadow-sm);
}

.stat .k {
  font-size: 11.5px;
  color: var(--ink-3);
  letter-spacing: 1px;
}

.stat .v {
  font-size: clamp(18px, 2.6vw, 24px);
  font-weight: 800;
  line-height: 1.3;
  font-variant-numeric: tabular-nums;
}

.stat .v.score { color: var(--mint-dark); }
.stat .v.combo { color: #e0a100; }
.stat .v.left  { color: var(--sky-dark); }
.stat .v.time  { color: var(--ink); }

/* 连击达到 2 以上时，数字弹一下 */
.stat .v.combo.hot {
  animation: comboPulse .5s ease;
}

@keyframes comboPulse {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.28); }
  100% { transform: scale(1); }
}

/* ==========================================================================
   游戏棋盘
   ========================================================================== */
.board-wrap {
  background: rgba(255, 255, 255, .66);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
  box-shadow: inset 0 2px 10px rgba(44, 110, 130, .05);
}

/* 图例：区分英文卡与中文卡 */
.legend {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-bottom: 12px;
  font-size: 12.5px;
  color: var(--ink-3);
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend i {
  width: 12px;
  height: 12px;
  border-radius: 4px;
  display: inline-block;
}

.legend i.en { background: var(--sky); }
.legend i.zh { background: var(--mint); }

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

/* ---------- 卡片 ---------- */
.card {
  position: relative;
  aspect-ratio: 1 / 1;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;

  padding: 6px;
  border: 2px solid transparent;
  border-radius: var(--r-md);

  background: #fff;
  color: var(--ink);
  text-align: center;
  word-break: break-word;
  cursor: pointer;

  box-shadow: 0 3px 0 rgba(44, 110, 130, .12), var(--shadow-sm);
  transition: transform .12s ease, box-shadow .12s ease,
              border-color .15s ease, background .15s ease, opacity .3s ease;
}

/* 顶部的彩色小条：蓝色 = 英文，绿色 = 中文，一眼区分
   注意：用 left/right + margin 居中，不用 transform ——
   卡片自身有 transform，用 transform 居中容易受其影响 */
.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  margin: 0 auto;
  width: 34%;
  height: 4px;
  border-radius: 0 0 4px 4px;
}

.card.en::before { background: var(--sky); }
.card.zh::before { background: var(--mint); }

.card .txt {
  font-size: clamp(13px, 1.7vw, 17px);
  font-weight: 700;
  line-height: 1.35;
}

/* 英文卡的字号略小，因为单词通常更长 */
.card.en .txt {
  font-size: clamp(12px, 1.6vw, 16px);
  letter-spacing: .3px;
}

.card .tag {
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 600;
  opacity: .45;
}

.card.en .tag { color: var(--sky-dark); }
.card.zh .tag { color: var(--mint-dark); }

.card:hover:not(.done) {
  transform: translateY(-3px);
  box-shadow: 0 6px 0 rgba(44, 110, 130, .12), var(--shadow-md);
}

.card:active:not(.done) {
  transform: translateY(1px);
  box-shadow: 0 1px 0 rgba(44, 110, 130, .12);
}

/* 选中态：暖黄高亮，明显但不刺眼 */
.card.selected {
  background: linear-gradient(180deg, #fff6d9, #ffedb0);
  border-color: var(--sun);
  box-shadow: 0 0 0 3px rgba(255, 201, 60, .35), 0 5px 0 #d9a017;
  transform: translateY(-3px);
  color: #6b4a00;
}

/* 配对成功 */
.card.ok {
  background: linear-gradient(180deg, #d8f7ec, #b6f0dd);
  border-color: var(--mint);
  animation: pop .32s ease;
}

/* 配对失败 */
.card.bad {
  background: linear-gradient(180deg, #ffe4e0, #ffcfc7);
  border-color: var(--coral);
  animation: shake .36s ease;
}

/* 已消除：淡出并留下凹槽，网格不塌陷 */
.card.done {
  opacity: .28;
  background: #f2f7f9;
  border-color: #e8f0f3;
  box-shadow: none;
  cursor: default;
  pointer-events: none;
  transform: scale(.92);
}

.card.done .txt,
.card.done .tag {
  opacity: 0;
}

@keyframes pop {
  0%   { transform: scale(1); }
  45%  { transform: scale(1.1); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(6px); }
  60%      { transform: translateX(-4px); }
  80%      { transform: translateX(4px); }
}

/* 棋盘内的信息块（未开始 / 已退出） */
.board-info {
  grid-column: 1 / -1;
  padding: 46px 18px;
  text-align: center;
  border-radius: var(--r-lg);
  background: linear-gradient(160deg, var(--mint-pale), var(--sky-pale));
  border: 2px dashed #bfe6de;
}

.board-info .big {
  font-size: 40px;
  line-height: 1;
  margin-bottom: 12px;
}

.board-info .t {
  font-size: clamp(16px, 2.2vw, 19px);
  font-weight: 700;
  color: var(--mint-dark);
  letter-spacing: 1px;
}

.board-info .d {
  margin-top: 6px;
  font-size: 13.5px;
  color: var(--ink-3);
}

/* ==========================================================================
   底部状态条
   ========================================================================== */
.status {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  padding: 11px 18px;

  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  box-shadow: var(--shadow-sm);
  font-size: 14px;
  color: var(--ink-2);
}

.status .msg {
  display: flex;
  align-items: center;
  gap: 7px;
}

.status .chip {
  background: var(--mint-pale);
  color: var(--mint-dark);
  font-weight: 700;
  padding: 4px 14px;
  border-radius: var(--r-pill);
  font-size: 13.5px;
  white-space: nowrap;
}

/* ==========================================================================
   浮动得分提示
   ========================================================================== */
.float {
  position: fixed;
  z-index: 90;
  pointer-events: none;
  font-size: 21px;
  font-weight: 800;
  color: var(--mint-dark);
  text-shadow: 0 2px 10px rgba(255, 255, 255, .95);
  animation: floatUp .95s ease-out forwards;
}

@keyframes floatUp {
  0%   { opacity: 1; transform: translate(-50%, 0) scale(.7); }
  30%  { transform: translate(-50%, -18px) scale(1.18); }
  100% { opacity: 0; transform: translate(-50%, -62px) scale(1); }
}

/* ==========================================================================
   连击横幅
   ========================================================================== */
.banner {
  position: fixed;
  left: 50%;
  top: 24%;
  z-index: 95;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -50%) scale(.6);
  font-size: clamp(26px, 5vw, 44px);
  font-weight: 900;
  letter-spacing: 3px;
  color: var(--sun);
  text-shadow: 0 3px 0 #d9a017, 0 10px 26px rgba(255, 201, 60, .55);
}

.banner.show {
  animation: bannerPop .85s ease-out;
}

@keyframes bannerPop {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(.55); }
  30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -92%) scale(.95); }
}

/* ==========================================================================
   弹窗
   ========================================================================== */
.modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 20px;

  background: rgba(44, 62, 70, .38);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);

  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}

.modal.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-card {
  width: min(100%, 430px);
  background: #fff;
  border-radius: var(--r-lg);
  padding: 28px 26px 24px;
  box-shadow: var(--shadow-lg);
  transform: translateY(16px) scale(.97);
  transition: transform .3s cubic-bezier(.22, 1, .36, 1);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
}

.modal.show .modal-card {
  transform: none;
}

.modal-card .emoji {
  font-size: 46px;
  line-height: 1;
  text-align: center;
  margin-bottom: 10px;
}

.modal-card h2 {
  text-align: center;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--ink);
  margin-bottom: 4px;
}

.modal-card .tip {
  text-align: center;
  font-size: 13.5px;
  color: var(--ink-3);
  margin-bottom: 20px;
}

.modal-card label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
  margin: 14px 0 6px;
  letter-spacing: .5px;
}

.modal-card input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid var(--line);
  border-radius: var(--r-pill);
  background: #fbfeff;
  color: var(--ink);
  font-size: 15px;
  font-family: inherit;
  transition: border-color .2s ease, box-shadow .2s ease;
}

.modal-card input:focus {
  outline: none;
  border-color: var(--mint);
  box-shadow: 0 0 0 4px rgba(52, 201, 163, .16);
}

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 22px;
}

/* 结算表格 */
.result-rows {
  background: #f7fdfb;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 6px 16px;
  margin-bottom: 4px;
}

.result-rows .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  font-size: 14.5px;
}

.result-rows .row + .row {
  border-top: 1px dashed var(--line);
}

.result-rows .row .k { color: var(--ink-3); }
.result-rows .row .v { font-weight: 800; font-variant-numeric: tabular-nums; }
.result-rows .row .v.hl { color: var(--mint-dark); font-size: 19px; }
.result-rows .row .v.new { color: #e0a100; }

/* 词库预览 */
.preview {
  margin-top: 4px;
  font-size: 13px;
  color: var(--ink-3);
  line-height: 1.9;
}

.preview b { color: var(--sky-dark); }

/* ==========================================================================
   快捷键提示
   ========================================================================== */
.hint-bar {
  margin-top: 12px;
  text-align: center;
  font-size: 12.5px;
  color: var(--ink-3);
}

kbd {
  display: inline-block;
  padding: 1px 7px;
  margin: 0 1px;
  background: #fff;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 11.5px;
  color: var(--ink-2);
}

/* ==========================================================================
   响应式
   ========================================================================== */

/* 平板 / 小笔记本：统计栏改两列 */
@media (max-width: 720px) {
  .app { padding: 20px 18px 18px; }

  .stats { grid-template-columns: repeat(2, 1fr); }

  .board { gap: 8px; }

  .board-wrap { padding: 12px; }

  .card .txt { font-size: clamp(12px, 3.4vw, 15px); }
  .card.en .txt { font-size: clamp(11px, 3.1vw, 14px); }
}

/* 手机：按钮与难度铺满一行，棋盘保持 4 列但更紧凑 */
@media (max-width: 480px) {
  body { padding: 12px 10px 28px; }

  .app { padding: 16px 13px 14px; border-radius: var(--r-md); }

  .head h1 { font-size: 20px; letter-spacing: 1px; }

  .difficulty { gap: 7px; }
  .diff-pill { padding: 8px 13px; font-size: 13px; }
  .diff-pill .n { display: none; }   /* 窄屏省略对数说明 */

  .bar { gap: 7px; }
  .btn { padding: 9px 14px; font-size: 13px; }

  .stats { gap: 7px; }
  .stat { padding: 8px 4px; }
  .stat .k { font-size: 10.5px; letter-spacing: .5px; }

  .board { gap: 6px; }
  .board-wrap { padding: 9px; }
  .legend { font-size: 11.5px; gap: 12px; margin-bottom: 9px; }

  .card { border-radius: var(--r-sm); }
  .card .txt { font-size: 12px; font-weight: 700; }
  .card.en .txt { font-size: 11px; }
  .card .tag { display: none; }      /* 窄屏隐藏 EN/中文标签，省空间 */

  .status { font-size: 13px; padding: 10px 14px; }
  .hint-bar { font-size: 11.5px; }
}

/* 超窄屏：去掉图例，卡片更小 */
@media (max-width: 360px) {
  .legend { display: none; }
  .card .txt { font-size: 11px; }
  .card.en .txt { font-size: 10px; }
}

/* 减弱动效偏好 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<div class="app">

  <!-- ==================== 标题 ==================== -->
  <header class="head">
    <h1><span class="em">🔤</span>猜词消消乐</h1>
    <p class="sub">点英文，再点它对应的中文 —— 配对成功即可消除</p>
    <div class="dots" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i>
    </div>
  </header>

  <!-- ==================== 难度 ==================== -->
  <div class="difficulty" role="group" aria-label="选择难度">
    <button class="diff-pill active" data-pairs="4" type="button">
      轻松 <span class="n">4 对</span>
    </button>
    <button class="diff-pill" data-pairs="8" type="button">
      标准 <span class="n">8 对</span>
    </button>
    <button class="diff-pill" data-pairs="12" type="button">
      挑战 <span class="n">12 对</span>
    </button>
    <button class="diff-pill" data-pairs="15" type="button">
      全部 <span class="n">15 对</span>
    </button>
  </div>

  <!-- ==================== 操作按钮 ==================== -->
  <div class="bar">
    <button class="btn green" id="btnStart" type="button">▶ 开始游戏</button>
    <button class="btn" id="btnRestart" type="button">⟲ 重来</button>
    <button class="btn sun" id="btnHint" type="button">💡 提示</button>
    <button class="btn ghost" id="btnAdd" type="button">➕ 添加单词</button>
    <button class="btn ghost" id="btnExit" type="button">⏹ 退出</button>
  </div>

  <!-- ==================== 状态栏 ==================== -->
  <div class="stats">
    <div class="stat">
      <div class="k">剩余对数</div>
      <div class="v left" id="sLeft">0</div>
    </div>
    <div class="stat">
      <div class="k">得分</div>
      <div class="v score" id="sScore">0</div>
    </div>
    <div class="stat">
      <div class="k">连击</div>
      <div class="v combo" id="sCombo">×1</div>
    </div>
    <div class="stat">
      <div class="k">用时</div>
      <div class="v time" id="sTime">00:00</div>
    </div>
  </div>

  <!-- ==================== 棋盘 ==================== -->
  <div class="board-wrap">
    <div class="legend">
      <span><i class="en"></i>英文单词</span>
      <span><i class="zh"></i>中文释义</span>
    </div>
    <div class="board" id="board"></div>
  </div>

  <!-- ==================== 底部状态 ==================== -->
  <div class="status">
    <span class="msg" id="statusMsg">✨ 选好难度，点「开始游戏」</span>
    <span class="chip" id="statusChip">最高分 0</span>
  </div>

  <p class="hint-bar">
    快捷键：<kbd>空格</kbd> 开始 / 重来 · <kbd>H</kbd> 提示 · <kbd>Esc</kbd> 关闭弹窗
  </p>
</div>

<!-- 连击横幅 -->
<div class="banner" id="banner"></div>

<!-- ==================== 弹窗 ==================== -->
<div class="modal" id="modal">
  <div class="modal-card" id="modalCard"></div>
</div>

<script>
/* ==========================================================================
   猜词消消乐 —— 游戏逻辑
   --------------------------------------------------------------------------
   玩法：棋盘上混排英文卡与中文卡，点一张英文再点它对应的中文即配对消除。
         连击会累积倍率，配对错误会中断连击并短暂锁屏。
   ========================================================================== */
(function () {
  'use strict';

  /* ======================================================================
     一、词库
     ====================================================================== */

  /* 内置词库：来自 hxtword.xlsx（英文单词 / 中文释义） */
  const BUILTIN = [
    { en: 'apple',    zh: '苹果' },
    { en: 'book',     zh: '书' },
    { en: 'cat',      zh: '猫' },
    { en: 'dog',      zh: '狗' },
    { en: 'elephant', zh: '大象' },
    { en: 'flower',   zh: '花' },
    { en: 'garden',   zh: '花园' },
    { en: 'house',    zh: '房子' },
    { en: 'internet', zh: '互联网' },
    { en: 'journey',  zh: '旅程' },
    { en: 'king',     zh: '国王' },
    { en: 'language', zh: '语言' },
    { en: 'mountain', zh: '山' },
    { en: 'nature',   zh: '自然' },
    { en: 'ocean',    zh: '海洋' }
  ];

  const STORE_WORDS = 'guessMatch.userWords';
  const STORE_BEST  = 'guessMatch.bestScore';

  /* 读取用户自己添加的词对 */
  function loadUserWords() {
    try {
      const raw = localStorage.getItem(STORE_WORDS);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(w => w && w.en && w.zh) : [];
    } catch (e) {
      return [];
    }
  }

  function saveUserWords(list) {
    try {
      localStorage.setItem(STORE_WORDS, JSON.stringify(list));
    } catch (e) {
      /* 隐私模式下 localStorage 可能不可用，忽略即可 */
    }
  }

  /* 合并词库：内置 + 用户添加（用户词库按英文去重） */
  function allWords() {
    const seen = new Set();
    const out = [];
    BUILTIN.concat(loadUserWords()).forEach(w => {
      const key = String(w.en).toLowerCase();
      if (seen.has(key)) { return; }
      seen.add(key);
      out.push({ en: String(w.en), zh: String(w.zh) });
    });
    return out;
  }

  /* 每个难度的最高分 */
  function loadBest() {
    try {
      const raw = localStorage.getItem(STORE_BEST);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveBest(obj) {
    try {
      localStorage.setItem(STORE_BEST, JSON.stringify(obj));
    } catch (e) {}
  }

  /* ======================================================================
     二、音效（Web Audio API 合成，不依赖音频文件）
     ====================================================================== */
  let audioCtx = null;
  let soundOn = true;

  function tone(freq, dur, type, gain) {
    if (!soundOn) { return; }
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { return; }
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }

      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      const vol = gain === undefined ? 0.14 : gain;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);

      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {
      /* 音效失败不影响游戏进行 */
    }
  }

  const sfx = {
    pick:  () => tone(720, 0.07, 'triangle', 0.09),
    match: n => tone(540 + Math.min(n, 8) * 62, 0.15, 'sine', 0.15),
    miss:  () => { tone(220, 0.14, 'square', 0.09); setTimeout(() => tone(170, 0.16, 'square', 0.07), 85); },
    hint:  () => tone(980, 0.12, 'sine', 0.10),
    win:   () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'sine', 0.14), i * 110))
  };

  /* ======================================================================
     三、状态
     ====================================================================== */
  const state = {
    pairs: 4,          // 当前难度对数
    cards: [],         // 卡片数组
    sel: null,         // 当前选中的卡片下标
    playing: false,    // 是否允许交互
    locked: false,     // 判定动画期间临时锁屏
    score: 0,
    combo: 0,
    maxCombo: 0,
    tries: 0,
    hits: 0,
    seconds: 0,
    timer: null,
    startAt: 0
  };

  const PAIR_SCORE = 10;    // 每对基础分
  const MISS_PENALTY = 5;   // 配错扣分
  const HINT_COST = 8;      // 提示扣分
  const LOCK_MS = 420;      // 判定动画时长

  /* ======================================================================
     四、DOM
     ====================================================================== */
  const $ = id => document.getElementById(id);
  const boardEl  = $('board');
  const modalEl  = $('modal');
  const modalCard = $('modalCard');
  const bannerEl = $('banner');
  const sLeft    = $('sLeft');
  const sScore   = $('sScore');
  const sCombo   = $('sCombo');
  const sTime    = $('sTime');
  const statusMsg  = $('statusMsg');
  const statusChip = $('statusChip');

  /* ======================================================================
     五、工具
     ====================================================================== */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function fmtTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }

  function setMsg(text) { statusMsg.textContent = text; }

  function refreshBestChip() {
    const best = loadBest()[state.pairs] || 0;
    statusChip.textContent = '最高分 ' + best;
  }

  /* ======================================================================
     六、计时
     ====================================================================== */
  function startTimer() {
    stopTimer();
    state.startAt = Date.now();
    state.seconds = 0;
    sTime.textContent = '00:00';
    state.timer = setInterval(function () {
      state.seconds = Math.floor((Date.now() - state.startAt) / 1000);
      sTime.textContent = fmtTime(state.seconds);
    }, 250);
  }

  function stopTimer() {
    if (state.timer) {
      clearInterval(state.timer);
      state.timer = null;
    }
  }

  /* ======================================================================
     七、界面刷新
     ====================================================================== */
  function updateStats() {
    sLeft.textContent  = state.cards.filter(c => !c.done).length / 2;
    sScore.textContent = state.score;
    sCombo.textContent = '×' + Math.max(1, state.combo);
    refreshBestChip();
  }

  /* 渲染棋盘 */
  function render() {
    boardEl.innerHTML = '';

    /* 未开始 / 已退出：显示引导块 */
    if (!state.cards.length) {
      const info = document.createElement('div');
      info.className = 'board-info';
      info.innerHTML = state.playing
        ? '<div class="big">🎯</div><div class="t">准备中…</div>'
        : '<div class="big">🎈</div>' +
          '<div class="t">准备好了吗？</div>' +
          '<div class="d">选好难度，点「开始游戏」就能玩啦</div>';
      boardEl.appendChild(info);
      return;
    }

    state.cards.forEach(function (card, i) {
      const el = document.createElement('div');
      el.className = 'card ' + card.lang +
        (card.done ? ' done' : '') +
        (state.sel === i && !card.done ? ' selected' : '');
      el.dataset.i = i;
      el.setAttribute('role', 'button');
      el.setAttribute('tabindex', card.done ? '-1' : '0');
      el.setAttribute('aria-label',
        (card.lang === 'en' ? '英文 ' : '中文 ') + card.text + (card.done ? '，已消除' : ''));

      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = card.done ? '' : card.text;

      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = card.lang === 'en' ? 'EN' : '中文';

      el.appendChild(txt);
      el.appendChild(tag);
      boardEl.appendChild(el);
    });
  }

  /* 按数据重绘单个卡片的状态，避免整块重排造成闪烁 */
  function paintCard(i) {
    const el = boardEl.querySelector('.card[data-i="' + i + '"]');
    const card = state.cards[i];
    if (!el || !card) { return; }
    el.className = 'card ' + card.lang +
      (card.done ? ' done' : '') +
      (state.sel === i && !card.done ? ' selected' : '');
    el.querySelector('.txt').textContent = card.done ? '' : card.text;
  }

  /* ======================================================================
     八、开局 / 结束
     ====================================================================== */
  function newGame() {
    const pool = allWords();

    /* 词库不足时给出提示，而不是静默重复出题 */
    if (pool.length < state.pairs) {
      showResult({
        title: '词库不够啦',
        emoji: '📚',
        tip: '当前共 ' + pool.length + ' 对单词，不足以支撑 ' + state.pairs + ' 对难度',
        rows: [],
        actions: [
          { text: '➕ 添加单词', cls: 'btn green', fn: function () { openAddWord(); } },
          { text: '换个难度', cls: 'btn ghost', fn: closeModal }
        ]
      });
      setMsg('⚠️ 词库不足，先添加一些单词吧');
      return;
    }

    const picked = shuffle(pool).slice(0, state.pairs);

    /* 每对拆成两张卡（英文 + 中文），再整体打乱 */
    const cards = [];
    picked.forEach(function (w, idx) {
      cards.push({ text: w.en, lang: 'en', pair: idx, done: false });
      cards.push({ text: w.zh, lang: 'zh', pair: idx, done: false });
    });

    state.cards   = shuffle(cards);
    state.sel     = null;
    state.playing = true;
    state.locked  = false;
    state.score   = 0;
    state.combo   = 0;
    state.maxCombo = 0;
    state.tries   = 0;
    state.hits    = 0;

    closeModal();
    render();
    updateStats();
    startTimer();
    setMsg('✨ 点一张英文，再点它对应的中文');
    $('btnStart').textContent = '⟳ 重新开始';
    sfx.pick();
  }

  function exitGame() {
    stopTimer();
    state.playing = false;
    state.locked = false;
    state.cards = [];
    state.sel = null;
    state.score = 0;
    state.combo = 0;
    sTime.textContent = '00:00';
    render();
    updateStats();
    setMsg('⏹ 已退出，随时可以重新开始');
    $('btnStart').textContent = '▶ 开始游戏';
  }

  function finish() {
    stopTimer();
    state.playing = false;
    state.sel = null;

    const acc = state.tries ? Math.round(state.hits / state.tries * 100) : 100;
    const used = state.seconds;
    const total = state.pairs;

    /* 先结算速度奖励，再判定新纪录 ——
       顺序不能反，否则存下来的最高分会漏掉这笔奖励 */
    let timeBonus = 0;
    if (used <= total * 8) {
      timeBonus = (total * 8 - used) * 2;
      state.score += timeBonus;
      sScore.textContent = state.score;
    }

    const best = loadBest();
    const prev = best[state.pairs] || 0;
    const isNew = state.score > prev;
    if (isNew) {
      best[state.pairs] = state.score;
      saveBest(best);
    }

    /* 根据表现调整文案 */
    let emoji = '🎉', title = '全部消除！';
    if (acc === 100 && used <= total * 6)      { emoji = '🏆'; title = '完美通关！'; }
    else if (acc >= 90)                        { emoji = '🌟'; title = '干得漂亮！'; }
    else if (acc >= 70)                        { emoji = '🎉'; title = '全部消除！'; }
    else                                       { emoji = '💪'; title = '通关成功'; }

    sfx.win();
    render();
    updateStats();

    showResult({
      emoji: emoji,
      title: title,
      tip: '本轮 ' + total + ' 对单词全部消除',
      rows: [
        ['最终得分', state.score + (isNew ? ' 🎊 新纪录' : ''), 'hl'],
        ['用时',     fmtTime(used)],
        ['正确率',   acc + '%（' + state.hits + '/' + state.tries + ' 次配对）'],
        ['最高连击', '×' + Math.max(1, state.maxCombo)],
        ['速度奖励', timeBonus ? '+' + timeBonus : '无'],
        ['本难度最高分', best[state.pairs] || 0]
      ],
      actions: [
        { text: '🔄 再来一局', cls: 'btn green', fn: function () { closeModal(); newGame(); } },
        { text: '换个难度',   cls: 'btn ghost', fn: closeModal }
      ]
    });

    setMsg('🎊 通关！用时 ' + fmtTime(used) + '，得分 ' + state.score);
  }

  /* ======================================================================
     九、配对判定
     ====================================================================== */
  function pick(i) {
    if (!state.playing || state.locked) { return; }
    const card = state.cards[i];
    if (!card || card.done) { return; }

    /* 再点一次取消选中 */
    if (state.sel === i) {
      state.sel = null;
      paintCard(i);
      return;
    }

    /* 还没选：选中它 */
    if (state.sel === null) {
      state.sel = i;
      paintCard(i);
      sfx.pick();
      return;
    }

    const a = state.cards[state.sel];
    const b = card;

    /* 必须是「一张英文 + 一张中文」且属于同一对 */
    const ok = a.lang !== b.lang && a.pair === b.pair;
    const firstIdx = state.sel;
    state.sel = null;
    state.tries++;
    state.locked = true;

    if (ok) {
      /* ---- 配对成功 ---- */
      state.hits++;
      state.combo++;
      state.maxCombo = Math.max(state.maxCombo, state.combo);

      const gain = PAIR_SCORE * state.combo;
      state.score += gain;

      markClass(firstIdx, 'ok');
      markClass(i, 'ok');
      popFloat('+' + gain, i);

      sfx.match(state.combo);
      if (state.combo >= 2) { showBanner('连击 ×' + state.combo + '!'); }

      /* 连击数字跳动 */
      sCombo.classList.remove('hot');
      void sCombo.offsetWidth;
      sCombo.classList.add('hot');

      setTimeout(function () {
        a.done = true;
        b.done = true;
        paintCard(firstIdx);
        paintCard(i);
        state.locked = false;
        updateStats();

        if (state.cards.every(c => c.done)) {
          finish();
        } else {
          setMsg('✨ 配对成功！继续保持');
        }
      }, 380);

    } else {
      /* ---- 配对失败 ---- */
      state.combo = 0;
      state.score = Math.max(0, state.score - MISS_PENALTY);

      markClass(firstIdx, 'bad');
      markClass(i, 'bad');
      popFloat('-' + MISS_PENALTY, i, true);
      sfx.miss();

      setTimeout(function () {
        clearClass(firstIdx);
        clearClass(i);
        state.locked = false;
        updateStats();
        setMsg('🤔 这两个不是一对，再看看');
      }, LOCK_MS);

      updateStats();
    }
  }

  /* 给卡片临时加状态类（不影响整体渲染） */
  function markClass(i, cls) {
    const el = boardEl.querySelector('.card[data-i="' + i + '"]');
    if (el) { el.classList.remove('selected'); el.classList.add(cls); }
  }

  function clearClass(i) {
    const el = boardEl.querySelector('.card[data-i="' + i + '"]');
    if (el) { el.classList.remove('ok', 'bad', 'selected'); }
  }

  /* 在卡片位置弹出得分提示 */
  function popFloat(text, i, bad) {
    const el = boardEl.querySelector('.card[data-i="' + i + '"]');
    if (!el) { return; }
    const r = el.getBoundingClientRect();
    const div = document.createElement('div');
    div.className = 'float';
    div.textContent = text;
    if (bad) { div.style.color = 'var(--coral)'; }
    div.style.left = (r.left + r.width / 2) + 'px';
    div.style.top  = r.top + 'px';
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 1000);
  }

  function showBanner(text) {
    bannerEl.textContent = text;
    bannerEl.classList.remove('show');
    void bannerEl.offsetWidth;
    bannerEl.classList.add('show');
  }

  /* ======================================================================
     十、提示：自动帮玩家找出一对可配的卡片
     ====================================================================== */
  function useHint() {
    if (!state.playing || state.locked) {
      setMsg('先开始游戏再用提示哦');
      return;
    }

    const alive = state.cards
      .map((c, i) => ({ c: c, i: i }))
      .filter(x => !x.c.done);

    if (!alive.length) { return; }

    /* 找一张英文和它同 pair 的中文 */
    const en = alive.find(x => x.c.lang === 'en');
    const zh = alive.find(x => x.c.lang === 'zh' && x.c.pair === en.c.pair);
    if (!en || !zh) { return; }

    /* 提示不要白给：扣一点分并把连击清零 */
    state.score = Math.max(0, state.score - HINT_COST);
    state.combo = 0;
    updateStats();
    sfx.hint();

    /* 高亮这一对 1.6 秒 */
    [en.i, zh.i].forEach(function (i) {
      const el = boardEl.querySelector('.card[data-i="' + i + '"]');
      if (!el) { return; }
      el.classList.add('selected');
      setTimeout(function () {
        if (state.sel !== i) { el.classList.remove('selected'); }
      }, 1600);
    });

    setMsg('💡 已高亮一对（扣 ' + HINT_COST + ' 分）');
  }

  /* ======================================================================
     十一、弹窗
     ====================================================================== */
  function showResult(opt) {
    const rows = (opt.rows || []).map(function (r) {
      const cls = r[2] ? ' ' + r[2] : '';
      return '<div class="row"><span class="k">' + r[0] +
             '</span><span class="v' + cls + '">' + r[1] + '</span></div>';
    }).join('');

    modalCard.innerHTML =
      '<div class="emoji">' + opt.emoji + '</div>' +
      '<h2>' + opt.title + '</h2>' +
      '<p class="tip">' + opt.tip + '</p>' +
      (rows ? '<div class="result-rows">' + rows + '</div>' : '') +
      '<div class="modal-actions"></div>';

    const actions = modalCard.querySelector('.modal-actions');
    (opt.actions || []).forEach(function (a) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = a.cls;
      b.textContent = a.text;
      b.addEventListener('click', a.fn);
      actions.appendChild(b);
    });

    modalEl.classList.add('show');
  }

  function openAddWord() {
    const userCount = loadUserWords().length;

    modalCard.innerHTML =
      '<div class="emoji">✏️</div>' +
      '<h2>添加新单词</h2>' +
      '<p class="tip">加进来的词会一起参与随机出题，保存在本机浏览器里</p>' +
      '<label for="inEn">英文单词</label>' +
      '<input id="inEn" type="text" placeholder="例如：library" autocomplete="off" spellcheck="false">' +
      '<label for="inZh">中文释义</label>' +
      '<input id="inZh" type="text" placeholder="例如：图书馆" autocomplete="off" spellcheck="false">' +
      '<div class="modal-actions">' +
        '<button class="btn green" id="btnSaveWord" type="button">保存</button>' +
        '<button class="btn ghost" id="btnCloseModal" type="button">关闭</button>' +
      '</div>' +
      '<p class="preview">当前已添加 <b>' + userCount + '</b> 个自定义单词</p>';

    modalEl.classList.add('show');
    $('inEn').focus();

    $('btnSaveWord').addEventListener('click', saveWord);
    $('btnCloseModal').addEventListener('click', closeModal);

    /* 回车直接保存 */
    ['inEn', 'inZh'].forEach(function (id) {
      $(id).addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); saveWord(); }
      });
    });
  }

  function saveWord() {
    const en = $('inEn').value.trim();
    const zh = $('inZh').value.trim();

    if (!en || !zh) {
      setMsg('⚠️ 英文和中文都要填哦');
      (!en ? $('inEn') : $('inZh')).focus();
      return;
    }

    const list = loadUserWords();
    /* 英文重复就不再加，避免棋盘上出现两个一样的词 */
    if (list.some(w => String(w.en).toLowerCase() === en.toLowerCase())) {
      setMsg('⚠️ 「' + en + '」已经在词库里了');
      $('inEn').focus();
      return;
    }

    list.push({ en: en, zh: zh });
    saveUserWords(list);

    $('inEn').value = '';
    $('inZh').value = '';
    $('inEn').focus();

    /* 更新计数与底部提示 */
    const counter = modalCard.querySelector('.preview b');
    if (counter) { counter.textContent = list.length; }
    setMsg('✅ 已添加「' + en + ' - ' + zh + '」，下一局生效');
    refreshBestChip();
  }

  function closeModal() {
    modalEl.classList.remove('show');
  }

  /* ======================================================================
     十二、事件绑定
     ====================================================================== */
  /* 棋盘点击（事件委托） */
  boardEl.addEventListener('click', function (e) {
    const el = e.target.closest('.card');
    if (!el) { return; }
    pick(parseInt(el.dataset.i, 10));
  });

  /* 键盘操作棋盘卡片，保证可访问性 */
  boardEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') { return; }
    const el = e.target.closest('.card');
    if (!el) { return; }
    e.preventDefault();
    pick(parseInt(el.dataset.i, 10));
  });

  /* 难度切换 */
  Array.prototype.forEach.call(document.querySelectorAll('.diff-pill'), function (btn) {
    btn.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.diff-pill'), function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      state.pairs = parseInt(btn.dataset.pairs, 10);
      refreshBestChip();

      /* 切换难度后停掉当前局，等玩家重新开始 */
      if (state.playing) {
        stopTimer();
        state.playing = false;
        state.locked = false;
        state.cards = [];
        state.sel = null;
        sTime.textContent = '00:00';
        render();
        updateStats();
        $('btnStart').textContent = '▶ 开始游戏';
        setMsg('已切换到 ' + state.pairs + ' 对，点「开始游戏」');
      } else {
        setMsg('难度：' + state.pairs + ' 对，点「开始游戏」');
      }
    });
  });

  $('btnStart').addEventListener('click', newGame);
  $('btnRestart').addEventListener('click', function () {
    if (state.playing) { newGame(); } else { setMsg('还没有开始游戏呢'); }
  });
  $('btnHint').addEventListener('click', useHint);
  $('btnAdd').addEventListener('click', openAddWord);
  $('btnExit').addEventListener('click', exitGame);

  /* 点遮罩关闭弹窗 */
  modalEl.addEventListener('click', function (e) {
    if (e.target === modalEl) { closeModal(); }
  });

  /* 快捷键 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); return; }

    /* 输入框里不触发快捷键 */
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') { return; }

    if (e.code === 'Space') {
      e.preventDefault();
      if (state.playing) { newGame(); } else { newGame(); }
    } else if (e.key === 'h' || e.key === 'H') {
      e.preventDefault();
      useHint();
    }
  });

  /* ======================================================================
     十三、初始化
     ====================================================================== */
  state.pairs = 4;
  state.cards = [];
  render();
  updateStats();
  refreshBestChip();

  console.log('%c猜词消消乐 已加载 ✓', 'color:#1fa586;font-weight:bold');
  console.log('词库：内置 ' + BUILTIN.length + ' 对 + 自定义 ' + loadUserWords().length + ' 对');

})();
</script>
</body>
</html>
